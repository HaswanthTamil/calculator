<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css"></link>
</head>
<body>
    <div id="calculator">
        <div id="display">display</div>
        <div id="keypad">

             <button class="btn" onclick=clearDisplay()>Clear</button>
             <button class="btn" onclick=backspace()>Backspace</button>
             <button class="btn red" onclick="numKey('(')">(</button>
             <button class="btn red" onclick="numKey(')')">)</button>
            <!-- Row 1 -->
             <button class="btn" onclick=numKey(7)>7</button>
             <button class="btn" onclick=numKey(8)>8</button>
             <button class="btn" onclick=numKey(9)>9</button>
             <button class="btn red" onclick="numKey('+')">+</button>
            <!-- Row 2 -->
             <button class="btn" onclick=numKey(4)>4</button>
             <button class="btn" onclick=numKey(5)>5</button>
             <button class="btn" onclick=numKey(6)>6</button>
             <button class="btn red" onclick="numKey('-')">-</button>
            <!-- Row 3 -->
             <button class="btn" onclick=numKey(1)>1</button>
             <button class="btn" onclick=numKey(2)>2</button>
             <button class="btn" onclick=numKey(3)>3</button>
             <button class="btn red" onclick="numKey('*')">*</button>
            <!-- Row 4 -->
             <button class="btn" onclick=numKey(0)>0</button>
             <button class="btn" onclick="numKey('.')">.</button>
             <button class="btn" onclick=calculate()>=</button>
             <button class="btn red" onclick="numKey('/')">/</button>
        </div>
    </div>
</body>
<script src="./script.js"></script>
</html>
